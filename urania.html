<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Passaggi Trasferte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#16202E; --muted:#5D6778; --line:#DCE0E8;
  --accent:#D9570B; --accent-ink:#FFFFFF; --accent-soft:#FBE7DA;
  --ok:#1F7A4D; --ok-soft:#DDF1E6; --danger:#B3261E;
  --req-bg:#FFF7F1; --req-line:#F3C9AE; --req-ink:#B4470A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10151D; --surface:#19202B; --ink:#E9ECF2; --muted:#9AA4B5; --line:#2C3544;
  --accent:#F07A2E; --accent-ink:#1A0E05; --accent-soft:#3A2416;
  --ok:#5CC28C; --ok-soft:#173326; --danger:#F08A80; --req-bg:#241811; --req-line:#5A3418; --req-ink:#F5A26B; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding:0 16px}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;margin:4px 0 0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.me{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:9px 14px}
.btn{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-link{background:none;border:none;padding:4px 6px;color:var(--muted);font-weight:600;font-size:.85rem;text-decoration:underline}
.btn-link.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.notice{border-radius:10px;padding:12px 14px;background:var(--accent-soft)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.form .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
details.new{background:var(--surface);border:1px dashed var(--line);border-radius:10px}
details.new>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;color:var(--accent)}
details.new>summary::-webkit-details-marker{display:none}
details.new[open]>summary{border-bottom:1px solid var(--line)}
details.new .inner{padding:14px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:76px 1fr;overflow:hidden}
.stub{background:var(--ink);color:var(--bg);display:grid;align-content:start;justify-items:center;padding:14px 4px;text-align:center;gap:2px;border-right:2px dashed var(--bg)}
.stub .dow{font-size:.72rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;opacity:.8}
.stub .day{font-family:var(--display);font-size:2.3rem;line-height:1;font-weight:700}
.stub .mon{font-family:var(--display);font-size:1rem;text-transform:uppercase;letter-spacing:.06em}
.stub .time{margin-top:8px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.tbody{padding:14px;display:grid;gap:12px;min-width:0}
.thead{display:flex;justify-content:space-between;gap:8px;align-items:start;flex-wrap:wrap}
.thead h2{font-family:var(--display);font-size:1.5rem;line-height:1.1;margin:0;text-transform:uppercase}
.meta{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.meta a{color:inherit}
.summary{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.free{background:var(--ok-soft);color:var(--ok)}
.chip.full{background:var(--accent-soft);color:var(--accent)}
.car{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.carhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.driver{font-weight:700}
.seats{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.seat{width:14px;height:14px;border-radius:4px;border:2px solid var(--ok)}
.seat.taken{background:var(--ink);border-color:var(--ink)}
.pax{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pax li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.95rem;background:var(--bg);border-radius:6px;padding:5px 8px}
.pax li span{overflow-wrap:anywhere;min-width:0}
.pax small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.3rem;text-transform:uppercase;margin-bottom:4px}
.past{display:grid;gap:10px;margin-top:8px}
.past .list{display:grid;gap:14px;opacity:.7}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border-radius:0;padding:4px 12px;font-size:.8rem;background:transparent;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.reqbox{border:1px solid var(--req-line);background:var(--req-bg);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.reqbox .label{color:var(--req-ink)}
.req{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip.need{background:var(--accent-soft);color:var(--req-ink)}
.btn-ok{background:var(--ok);color:var(--accent-ink)}
.btn-dash{background:transparent;color:var(--req-ink);border:1px dashed var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;color:var(--ink);cursor:pointer}
.seg input{width:auto}
.pf{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pf label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.me .meta{font-size:.82rem}
.me[hidden]{display:none}
.topr{display:flex;gap:8px;align-items:center}
.ubtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8rem;background:transparent;color:var(--ink);max-width:190px}
.ubtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.wa{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:min(560px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:5}
.wa[hidden]{display:none}
.gate{position:fixed;inset:0;background:var(--bg);z-index:10;display:grid;place-items:center;padding:16px;overflow:auto}
.gate[hidden]{display:none}
.gbox{width:min(440px,100%);display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.gbox h2{font-family:var(--display);font-size:1.8rem;line-height:1.1;margin:0;text-transform:uppercase}
.gmore{display:grid;gap:12px}
.gmore[hidden]{display:none}
.gbox label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.wa .wahead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.wa .wabtns{display:flex;gap:8px;flex-wrap:wrap}
.wa a.wabtn{background:#1E9E50;color:#fff;text-decoration:none;font-weight:600;border-radius:8px;padding:9px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);z-index:20}
@media (max-width:420px){.trip{grid-template-columns:62px 1fr}.stub .day{font-size:1.9rem}h1{font-size:2rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><div class="label">Urania Milano · U17 Eccellenza 2026/27</div><div class="topr"><button type="button" class="ubtn" id="ubtn" data-act="toggle-me" aria-expanded="false" aria-controls="me">👤 <span id="uname"></span></button><div class="lang" role="group" aria-label="Lingua / Language"><button type="button" data-lang="it">IT</button><button type="button" data-lang="en">EN</button></div></div></div>
    <h1 data-i18n-html="title"></h1>
    <p class="lead" data-i18n="lead"></p>
  </header>

  <div id="status" class="notice" hidden></div>

  <div class="me" id="me" hidden>
    <div class="label" data-i18n="meTitle"></div>
    <div class="pf">
      <label><span data-i18n="meLabel"></span><input id="meName" data-i18n-ph="mePh" autocomplete="name"></label>
      <label><span data-i18n="meKid"></span><input id="meKid" data-i18n-ph="bKidPh"></label>
      <label><span data-i18n="meTel"></span><input id="meTel" type="tel" placeholder="333 1234567" autocomplete="tel"></label>
    </div>
    <div class="meta" data-i18n="meNote"></div>
  </div>

  <details class="new" id="newTrip">
    <summary data-i18n="addTrip"></summary>
    <div class="inner">
      <form id="tripForm" class="form">
        <label class="full"><span data-i18n="fGame"></span><input id="tTitle" required data-i18n-ph="fGamePh"></label>
        <label><span data-i18n="fDate"></span><input id="tDate" type="date" required></label>
        <label><span data-i18n="fTip"></span><input id="tTime" type="time"></label>
        <label class="full"><span data-i18n="fGym"></span><input id="tPlace" data-i18n-ph="fGymPh"></label>
        <label class="full"><span data-i18n="fNote"></span><input id="tNote" data-i18n-ph="fNotePh"></label>
        <div class="actions"><button class="btn" type="submit" data-i18n="fAddBtn"></button></div>
      </form>
    </div>
  </details>

  <section id="list" aria-live="polite">
    <div class="empty"><strong data-i18n="loading"></strong><span data-i18n="loadingSub"></span></div>
  </section>

  <section class="past" id="pastBox" hidden>
    <div class="label" id="pastSum"></div>
    <div class="list" id="pastList"></div>
  </section>
</div>
<div class="gate" id="gate" hidden>
  <form id="gateForm" class="gbox">
    <h2 data-i18n="gTitle"></h2>
    <div class="meta" data-i18n="gWhy"></div>
    <label><span data-i18n="meTel"></span><input id="gTel" type="tel" required placeholder="333 1234567" autocomplete="tel"></label>
    <div class="gmore" id="gMore" hidden>
      <label><span data-i18n="meLabel"></span><input id="gName" data-i18n-ph="mePh" autocomplete="name"></label>
      <label><span data-i18n="meKid"></span><input id="gKid" data-i18n-ph="bKidPh"></label>
    </div>
    <button class="btn" type="submit" data-i18n="gEnter"></button>
  </form>
</div>
<div class="wa" id="wa" hidden></div>
<div class="toast" id="toast" hidden></div>

      gTitle:'Welcome! Who are you?', gWhy:'Enter your mobile number: if you have used it here before, you are in straight away. It lets drivers be notified on WhatsApp and lets you find yourself again from another phone.', gNew:'First time here: please also enter your name and your kid\'s name', gBack:'Welcome back, {n}!', gEnter:'Enter', ERR_TEL:'Enter a valid mobile number',
      ERR_REQ_GONE:'This request is no longer available',
      dow:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], mon:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
    }
  };

  // Dentro Google la pagina usa google.script.run; su GitHub chiama lo stesso codice via internet
  var API = "https://script.google.com/macros/s/AKfycbxHlZOHKBLfb8eNIOXuArP4iqQcwSVcJF2qEhi3IXAMFWCZFVFSbqep_Vhfn5-rB9WleQ/exec";
  var GS = typeof google !== "undefined" && google.script && google.script.run ? true : false;
  var PFX = GS ? "" : "u-";
  function run(fn, args, ok, ko){
    if(GS){ var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko); r[fn].apply(r, args); return; }
    fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function(x){ return x.json(); })
      .then(function(j){ if(j && j.ok) ok(j.res); else ko(new Error(j && j.error || "ERR")); })
      .catch(ko);
  }
  function store(k, v){ k = PFX + k; try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  var lang = store("pt-lang") || ((navigator.language||"it").toLowerCase().indexOf("it") === 0 ? "it" : "en");
  function T(k, vars){ var s = (I18N[lang][k] != null ? I18N[lang][k] : I18N.it[k]); if(vars) Object.keys(vars).forEach(function(v){ s = s.split("{"+v+"}").join(vars[v]); }); return s; }

  function applyStatic(){
    document.documentElement.lang = lang;
    document.title = lang === "it" ? "Passaggi Trasferte" : "Away Game Rides";
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = T(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(function(el){ el.innerHTML = T(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){ el.placeholder = T(el.dataset.i18nPh); });
    document.querySelectorAll("[data-lang]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"); });
  }

  // Codice anonimo di questo telefono: serve solo a capire cosa hai inserito tu (per poterlo cancellare)
  var token = store("pt-token");
  if(!token){ token = Math.random().toString(36).slice(2) + Date.now().toString(36); store("pt-token", token); }

  var trips = [], rides = [], bookings = [], requests = [], hasReq = false, loaded = false;
  var ui = { offer: null, book: null, confirm: null, req: null };
  var busy = false;

  var nameInput = $("#meName"), kidInput = $("#meKid"), telInput = $("#meTel");
  nameInput.value = store("pt-name") || "";
  kidInput.value = store("pt-kid") || "";
  telInput.value = store("pt-tel") || "";
  function myName(){ return nameInput.value.trim(); }
  function myKid(){ return kidInput.value.trim(); }
  function myTel(){ return telInput.value.trim(); }
  function telOk(t){ var d = waNum(t); return d.length >= 10 && d.length <= 15; }
  var profT;
  function saveProfile(){
    store("pt-name", myName()); store("pt-kid", myKid()); store("pt-tel", myTel()); setUname();
    clearTimeout(profT);
    profT = setTimeout(function(){
      if(!myName() || !telOk(myTel())) return;
      run("login", [{ genitore: myName(), ragazzo: myKid(), telefono: myTel() }, token], function(res){
        if(res && res.token && res.token !== token){ token = res.token; store("pt-token", token); busy = false; refresh(); }
        toast(T("tProfile"));
      }, function(){});
    }, 600);
  }
  [nameInput, kidInput, telInput].forEach(function(el){ el.addEventListener("change", saveProfile); });

  var toastT;
  function toast(msg){ var t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; }, 2800); }

  /* ---- WhatsApp: si apre la chat con il messaggio già scritto, chi lo manda preme solo invia ---- */
  function waNum(tel){
    var d = String(tel||"").replace(/[^\d+]/g, "");
    if(d.indexOf("+") === 0) d = d.slice(1); else if(d.indexOf("00") === 0) d = d.slice(2); else if(/^3\d{8,9}$/.test(d)) d = "39" + d;
    d = d.replace(/\D/g, "");
    return d.length >= 8 ? d : "";
  }
  function firstName(s){ return String(s||"").split(/\s[-–·,]\s|,/)[0].trim(); }
  function tripTxt(id){
    var t = trips.filter(function(x){ return x.id === id; })[0]; if(!t) return { trip:"", d:"" };
    var p = parts(t.data), m = (t.data||"").split("-");
    return { trip: t.partita, d: p.dow.toLowerCase() + " " + Number(m[2]) + "/" + Number(m[1]) };
  }
  function waShow(items){
    items = items.filter(function(x){ return waNum(x.tel); });
    var box = $("#wa"); if(!items.length){ box.hidden = true; return; }
    box.innerHTML = '<div class="wahead"><span>'+T("waTitle")+'</span><button class="btn-link" type="button" data-act="wa-close">'+T("waClose")+'</button></div><div class="wabtns">'
      + items.map(function(x){ return '<a class="wabtn" target="_blank" rel="noopener" href="https://wa.me/'+waNum(x.tel)+'?text='+encodeURIComponent(x.text)+'">'+esc(T("waTo",{p:firstName(x.name)||x.name}))+'</a>'; }).join("") + '</div>';
    box.hidden = false;
  }

  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parts(ds){ var p=(ds||"").split("-").map(Number); var dt=new Date(p[0],(p[1]||1)-1,p[2]||1); return {dow:T("dow")[dt.getDay()], day:p[2]||"?", mon:T("mon")[(p[1]||1)-1]}; }
  // Una trasferta è "iniziata" dalla palla a due (senza orario: dalla fine della giornata)
  function started(t, now){
    var p = (t.data||"").split("-").map(Number), h = (t.ora||"23:59").split(":").map(Number);
    if(!p[0]) return false;
    return new Date(p[0], (p[1]||1)-1, p[2]||1, h[0]||0, h[1]||0).getTime() <= now;
  }
  function needName(){ if(myName()) return true; toast(T("tName")); showMe(true); nameInput.focus(); return false; }
  function showMe(open){ $("#me").hidden = !open; $("#ubtn").setAttribute("aria-expanded", open ? "true" : "false"); }
  function setUname(){ $("#uname").textContent = firstName(myName()) || T("meTitle"); }
  function routeLink(from, to){ return "https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=" + encodeURIComponent(from) + "&destination=" + encodeURIComponent(to); }
  function mapsLink(place){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(place); }

  /* ---- chiamate al foglio ---- */
  function call(fn, args, onOk){
    busy = true;
    run(fn, args, function(res){ busy = false; onOk(res); }, function(err){
        busy = false;
        var code = err && err.message ? (err.message.match(/ERR_[A-Z_]+/) || [""])[0] : "";
        toast(code && I18N.it[code] ? T(code) : T("tFail")); document.querySelectorAll("button:disabled").forEach(function(x){ x.disabled=false; }); render();
      });
  }
  function apply(d){ trips=d.trips; rides=d.rides; bookings=d.bookings; hasReq=Array.isArray(d.requests); requests=d.requests||[]; loaded=true; render(); }
  function refresh(){ if(busy || ui.offer || ui.book || ui.req) return; call("getData", [token], apply); }

  /* ---- disegno ---- */
  function render(){
    if(!loaded) return;
    var now = Date.now();
    var sorted = trips.slice().sort(function(a,b){ return (a.data+(a.ora||"")).localeCompare(b.data+(b.ora||"")); });
    var up = sorted.filter(function(t){ return !started(t, now); });
    var past = sorted.filter(function(t){ return started(t, now); }).reverse();
    $("#list").innerHTML = up.length
      ? '<div style="display:grid;gap:14px">' + up.map(function(t){ return tripHTML(t,false); }).join("") + '</div>'
      : '<div class="empty"><strong>'+T("emptyT")+'</strong>'+T("emptyS")+'</div>';
    $("#pastBox").hidden = !past.length;
    $("#pastSum").textContent = T("past", {n: past.length});
    $("#pastList").innerHTML = past.map(function(t){ return tripHTML(t,true); }).join("");
  }

  function tripHTML(t, isPast){
    var p = parts(t.data);
    var tr = rides.filter(function(r){ return r.trasfertaId === t.id; }).sort(function(a,b){ return a.creato.localeCompare(b.creato); });
    var tot = 0, taken = 0;
    tr.forEach(function(r){ tot += Number(r.posti)||0; taken += bookings.filter(function(b){ return b.autoId===r.id; }).length; });
    var free = Math.max(0, tot-taken);
    var chip = tr.length
      ? '<span class="chip">' + T("cars",{n:tr.length}) + '</span><span class="chip ' + (free?"free":"full") + '">' + (free ? (free===1 ? T("free1") : T("freeN",{n:free})) : T("allFull")) + '</span>'
      : '<span class="chip">'+T("noCars")+'</span>';
    var rq = requests.filter(function(q){ return q.trasfertaId === t.id; }).sort(function(a,b){ return a.creato.localeCompare(b.creato); });
    if(rq.length) chip += '<span class="chip need">' + (rq.length===1 ? T("need1") : T("needN",{n:rq.length})) + '</span>';
    var h = '<article class="trip"><div class="stub"><span class="dow">'+p.dow+'</span><span class="day">'+p.day+'</span><span class="mon">'+p.mon+'</span>'
      + (t.ora ? '<span class="time" title="'+T("tipTitle")+'">'+esc(t.ora)+'</span>' : '') + '</div><div class="tbody">'
      + '<div class="thead"><div style="min-width:0"><h2>'+esc(t.partita)+'</h2>'
      + (t.palestra ? '<div class="meta">📍 <a href="'+mapsLink(t.palestra)+'" target="_blank" rel="noopener">'+esc(t.palestra)+'</a></div>' : '')
      + (t.note ? '<div class="meta">'+esc(t.note)+'</div>' : '')
      + '</div><div class="summary">'+chip+'</div></div>'
      + tr.map(function(r){ return rideHTML(r,isPast); }).join("");
    if(rq.length && !isPast) h += reqBox(t, rq, tr);
    if(!isPast){
      if(ui.offer === t.id) h += offerForm(t.id);
      else if(ui.req === t.id) h += reqForm(t.id);
      else h += '<div class="row"><button class="btn-ghost" data-act="open-offer" data-id="'+t.id+'">'+T("offer")+'</button>'
        + (hasReq ? '<button class="btn-dash" data-act="open-req" data-id="'+t.id+'">'+T("reqBtn")+'</button>' : '') + '</div>';
    }
    if(t.mine && !isPast){
      h += ui.confirm === "trip:"+t.id
        ? '<div class="confirm">'+T("delTripQ")+' <button class="btn-link danger" data-act="del-trip" data-id="'+t.id+'">'+T("yesDel")+'</button><button class="btn-link" data-act="cancel">'+T("cancel")+'</button></div>'
        : '<div><button class="btn-link" data-act="ask-del-trip" data-id="'+t.id+'">'+T("delTrip")+'</button></div>';
    }
    return h + '</div></article>';
  }

  function rideHTML(r, isPast){
    var bs = bookings.filter(function(b){ return b.autoId===r.id; }).sort(function(a,b){ return a.creato.localeCompare(b.creato); });
    var n = Number(r.posti)||0, free = Math.max(0, n - bs.length);
    var trip = trips.filter(function(t){ return t.id === r.trasfertaId; })[0];
    var dots = ""; for(var i=0;i<n;i++) dots += '<span class="seat'+(i<bs.length?" taken":"")+'" title="'+(i<bs.length?T("taken"):T("seatFree"))+'"></span>';
    var h = '<div class="car"><div class="carhead"><div style="min-width:0"><span class="driver">'+esc(r.chiGuida)+'</span>'
      + (r.telefono ? ' <span class="meta">· '+esc(r.telefono)+'</span>' : '')
      + '<div class="meta">'+T("from",{p:esc(r.parteDa||"—")})+(r.oraPartenza?T("at",{t:esc(r.oraPartenza)}):'')+(r.ritorno==="Sì"?T("back"):T("oneWay"))+'</div>'
      + (r.km ? '<div class="meta">🧭 '+T("km",{n:esc(r.km)})+(trip && trip.palestra ? ' · <a href="'+routeLink(r.parteDa, trip.palestra)+'" target="_blank" rel="noopener">'+T("route")+'</a>' : '')+'</div>' : '')
      + (r.note ? '<div class="meta">'+esc(r.note)+'</div>' : '')
      + '</div><div class="seats" aria-label="'+T("seatsAria",{f:free,n:n})+'">'+dots+'<span class="chip '+(free?"free":"full")+'">'+(free?T("freeShort",{n:free}):T("fullShort"))+'</span></div></div>';
    if(bs.length){
      h += '<ul class="pax">' + bs.map(function(b){
        return '<li><span>'+esc(b.ragazzo)+(b.caricaA?' <small>· '+T("picksAt",{p:esc(b.caricaA)})+'</small>':'')+' <small>· '+T("bookedBy",{p:esc(b.prenotatoDa)})+'</small></span>'
          + (!isPast && (b.mine || r.mine) ? '<button class="btn-link danger" data-act="unbook" data-id="'+b.id+'">'+T("release")+'</button>' : '') + '</li>';
      }).join("") + '</ul>';
    }
    if(!isPast){
      h += '<div class="row">';
      if(free && ui.book !== r.id) h += '<button class="btn" data-act="open-book" data-id="'+r.id+'">'+T("book")+'</button>';
      if(r.mine){
        h += ui.confirm === "ride:"+r.id
          ? '<span class="confirm">'+T("delRideQ")+' <button class="btn-link danger" data-act="del-ride" data-id="'+r.id+'">'+T("yes")+'</button><button class="btn-link" data-act="cancel">'+T("no")+'</button></span>'
          : '<button class="btn-link" data-act="ask-del-ride" data-id="'+r.id+'">'+T("delRide")+'</button>';
      }
      h += '</div>';
      if(ui.book === r.id && free) h += bookForm(r.id);
    }
    return h + '</div>';
  }

  function reqBox(t, rq, tr){
    return '<div class="reqbox"><div class="label">'+T("reqTitle")+'</div>' + rq.map(function(q){
      return '<div class="req"><div style="min-width:0"><b>'+esc(q.ragazzo)+'</b> <span class="meta">'
        + (q.daDove ? '· '+T("fromWhere",{p:esc(q.daDove)})+' ' : '') + '· '+T(q.tratta||"ar")+' · '+T("reqBy",{p:esc(q.richiestoDa)})+'</span></div>'
        + '<div class="row">' + '<button class="btn btn-ok" data-act="take" data-id="'+q.id+'" data-trip="'+t.id+'">'+T("take")+'</button>'
        + (q.mine ? '<button class="btn-link danger" data-act="del-req" data-id="'+q.id+'">'+T("reqDel")+'</button>' : '') + '</div></div>';
    }).join("") + '</div>';
  }
  function reqForm(id){
    return '<form class="form" data-form="req" data-id="'+id+'" style="border-top:1px solid var(--line);padding-top:12px">'
      + '<label>'+T("rKid")+'<input id="q-kid" required placeholder="'+esc(T("bKidPh"))+'" value="'+esc(myKid())+'"></label>'
      + '<label>'+T("rFrom")+'<input id="q-from" placeholder="'+esc(T("rFromPh"))+'"></label>'
      + '<label class="full">'+T("tel")+'<input id="q-tel" type="tel" placeholder="333 1234567" value="'+esc(myTel())+'"></label>'
      + '<div class="full seg"><label><input type="radio" name="q-tr" value="ar" checked> '+T("ar")+'</label><label><input type="radio" name="q-tr" value="andata"> '+T("andata")+'</label><label><input type="radio" name="q-tr" value="ritorno"> '+T("ritorno")+'</label></div>'
      + '<div class="actions"><button class="btn" type="submit">'+T("rSubmit")+'</button><button class="btn-ghost" type="button" data-act="cancel">'+T("cancel")+'</button></div></form>';
  }
  function offerForm(id){
    var opts = ""; for(var n=1;n<=8;n++) opts += '<option'+(n===3?" selected":"")+'>'+n+'</option>';
    return '<form class="form" data-form="offer" data-id="'+id+'" style="border-top:1px solid var(--line);padding-top:12px">'
      + '<label>'+T("oSeats")+'<select id="o-seats">'+opts+'</select></label>'
      + '<label>'+T("oTime")+'<input id="o-time" type="time"></label>'
      + '<label class="full">'+T("oFrom")+'<input id="o-from" required placeholder="'+esc(T("oFromPh"))+'"></label>'
      + '<label class="full">'+T("oTel")+'<input id="o-tel" type="tel" placeholder="333 1234567" value="'+esc(myTel())+'"></label>'
      + '<label class="full">'+T("fNote")+'<input id="o-note" placeholder="'+esc(T("oNotePh"))+'"></label>'
      + '<label class="full" style="display:flex;gap:8px;align-items:center"><input id="o-back" type="checkbox" checked style="width:auto"> '+T("oBack")+'</label>'
      + '<div class="actions"><button class="btn" type="submit">'+T("oSubmit")+'</button><button class="btn-ghost" type="button" data-act="cancel">'+T("cancel")+'</button></div></form>';
  }
  function bookForm(id){
    return '<form class="form" data-form="book" data-id="'+id+'">'
      + '<label>'+T("bKid")+'<input id="b-ath" required placeholder="'+esc(T("bKidPh"))+'" value="'+esc(myKid())+'"></label>'
      + '<label>'+T("bPick")+'<input id="b-pick" placeholder="'+esc(T("bPickPh"))+'"></label>'
      + '<label class="full">'+T("tel")+'<input id="b-tel" type="tel" placeholder="333 1234567" value="'+esc(myTel())+'"></label>'
      + '<div class="actions"><button class="btn" type="submit">'+T("bSubmit")+'</button><button class="btn-ghost" type="button" data-act="cancel">'+T("cancel")+'</button></div></form>';

  /* ---- azioni ---- */
  document.addEventListener("click", function(ev){
    var lb = ev.target.closest("[data-lang]");
    if(lb){ lang = lb.dataset.lang; store("pt-lang", lang); applyStatic(); setUname(); render(); return; }
    if(ev.target.closest("a.wabtn")){ setTimeout(function(){ $("#wa").hidden = true; }, 300); return; }
    var b = ev.target.closest("[data-act]"); if(!b) return;
    if(b.dataset.act==="wa-close"){ $("#wa").hidden = true; return; }
    if(b.dataset.act==="toggle-me"){ showMe($("#me").hidden); return; }
    var act = b.dataset.act, id = b.dataset.id;
    if(act==="open-offer"){ if(!needName()) return; ui.offer=id; ui.book=null; ui.req=null; ui.confirm=null; render(); return; }
    if(act==="open-book"){ if(!needName()) return; ui.book=id; ui.offer=null; ui.confirm=null; render(); return; }
    if(act==="open-req"){ if(!needName()) return; ui.req=id; ui.offer=null; ui.book=null; ui.confirm=null; render(); return; }
    if(act==="take"){
      if(!needName()) return;
      var tripId = b.dataset.trip;
      var mineCars = rides.filter(function(r){ return r.trasfertaId===tripId && r.mine; });
      if(!mineCars.length){ toast(T("tNeedCar")); ui.offer=tripId; ui.req=null; ui.book=null; render(); return; }
      var car = mineCars.filter(function(r){ return bookings.filter(function(x){ return x.autoId===r.id; }).length < Number(r.posti); })[0];
      if(!car){ toast(T("tCarFull")); return; }
      b.disabled = true;
      var rq0 = requests.filter(function(q){ return q.id === id; })[0] || {}, tt = tripTxt(tripId);
      var waT = { tel: rq0.telefono, name: rq0.richiestoDa, text: T("waTake", { to: firstName(rq0.richiestoDa), kid: rq0.ragazzo, trip: tt.trip, d: tt.d, from: car.parteDa, at: car.oraPartenza ? T("waAt",{t:car.oraPartenza}) : "" }) };
      call("takeRequest", [id, car.id, token], function(res){ apply(res.data); toast(res.full ? T("tCarFull") : T("tTaken")); if(!res.full) waShow([waT]); });
      return;
    }
    if(act==="cancel"){ ui.offer=ui.book=ui.confirm=ui.req=null; render(); return; }
    if(act==="ask-del-trip"){ ui.confirm="trip:"+id; render(); return; }
    if(act==="ask-del-ride"){ ui.confirm="ride:"+id; render(); return; }
    b.disabled = true;
    if(act==="del-req") call("deleteRequest", [id, token], function(d){ apply(d); toast(T("tReqDel")); });
    if(act==="unbook"){
      var bk = bookings.filter(function(x){ return x.id === id; })[0] || {}, rd = rides.filter(function(r){ return r.id === bk.autoId; })[0] || {}, tu = tripTxt(bk.trasfertaId);
      var waU = bk.mine
        ? { tel: rd.telefono, name: rd.chiGuida, text: T("waUnbook", { to: firstName(rd.chiGuida), kid: bk.ragazzo, trip: tu.trip, d: tu.d }) }
        : { tel: bk.telefono, name: bk.prenotatoDa, text: T("waUnbookD", { to: firstName(bk.prenotatoDa), kid: bk.ragazzo, trip: tu.trip, d: tu.d }) };
      call("unbook", [id, token], function(d){ apply(d); toast(T("tFreed")); waShow([waU]); });
    }
    if(act==="del-ride"){
      var rr = rides.filter(function(r){ return r.id === id; })[0] || {}, tr2 = tripTxt(rr.trasfertaId);
      var waR = bookings.filter(function(x){ return x.autoId === id; }).map(function(x){
        return { tel: x.telefono, name: x.prenotatoDa, text: T("waRideDel", { to: firstName(x.prenotatoDa), kid: x.ragazzo, trip: tr2.trip, d: tr2.d }) };
      });
      call("deleteRide", [id, token], function(d){ ui.confirm=null; apply(d); toast(T("tRideDel")); waShow(waR); });
    }
    if(act==="del-trip") call("deleteTrip", [id, token], function(d){ ui.confirm=null; apply(d); toast(T("tTripDel")); });
  });

  document.addEventListener("submit", function(ev){
    ev.preventDefault();
    var f = ev.target, btn = f.querySelector("button[type=submit]");
    if(f.id==="gateForm"){
      var more = !$("#gMore").hidden;
      var gn = $("#gName").value.trim(), gk = $("#gKid").value.trim(), gt = $("#gTel").value.trim();
      if(!telOk(gt)){ toast(T("ERR_TEL")); $("#gTel").focus(); return; }
      if(more && !gn){ toast(T("ERR_NAME")); $("#gName").focus(); return; }
      if(btn) btn.disabled = true;
      call("login", [{ genitore: more ? gn : "", ragazzo: more ? gk : "", telefono: gt }, token], function(res){
        if(btn) btn.disabled = false;
        if(res && res.need){ $("#gMore").hidden = false; toast(T("gNew")); $("#gName").focus(); return; }
        var n = res.genitore || gn, k = res.ragazzo || gk;
        token = res.token; store("pt-token", token);
        nameInput.value = n; kidInput.value = k; telInput.value = gt;
        store("pt-name", n); store("pt-kid", k); store("pt-tel", gt); store("pt-ok", "1");
        $("#gate").hidden = true; setUname(); toast(T("gBack", { n: firstName(n) })); start();
      });
      return;
    }
    if(!needName()) return;
    if(btn) btn.disabled = true;
    if(f.id==="tripForm"){
      call("addTrip", [{ partita:$("#tTitle").value.trim(), data:$("#tDate").value, ora:$("#tTime").value,
        palestra:$("#tPlace").value.trim(), note:$("#tNote").value.trim(), creatoDa:myName() }, token],
        function(d){ f.reset(); $("#newTrip").open=false; apply(d); toast(T("tTripAdd")); if(btn) btn.disabled=false; });
    } else if(f.dataset.form==="offer"){
      call("addRide", [{ trasfertaId:f.dataset.id, chiGuida:myName(), telefono:$("#o-tel").value.trim(),
        parteDa:$("#o-from").value.trim(), oraPartenza:$("#o-time").value, ritorno:$("#o-back").checked,
        posti:$("#o-seats").value, note:$("#o-note").value.trim() }, token],
        function(d){ ui.offer=null; apply(d); toast(T("tRideAdd")); });
    } else if(f.dataset.form==="req"){
      var tr = f.querySelector('input[name="q-tr"]:checked');
      call("addRequest", [{ trasfertaId:f.dataset.id, ragazzo:$("#q-kid").value.trim(), daDove:$("#q-from").value.trim(),
        tratta: tr ? tr.value : "ar", richiestoDa:myName(), telefono:$("#q-tel").value.trim() }, token],
        function(d){ ui.req=null; apply(d); toast(T("tReqAdd")); });
    } else if(f.dataset.form==="book"){
      var rb = rides.filter(function(r){ return r.id === f.dataset.id; })[0] || {}, tb = tripTxt(rb.trasfertaId);
      var kidB = $("#b-ath").value.trim(), pickB = $("#b-pick").value.trim();
      var waB = { tel: rb.telefono, name: rb.chiGuida, text: T("waBook", { to: firstName(rb.chiGuida), kid: kidB, trip: tb.trip, d: tb.d, pick: pickB ? T("waPick",{p:pickB}) : "" }) };
      call("book", [{ autoId:f.dataset.id, ragazzo:kidB, caricaA:pickB, prenotatoDa:myName(), telefono:$("#b-tel").value.trim() }, token],
        function(res){ ui.book=null; apply(res.data); toast(res.full ? T("tFull") : T("tBooked")); if(!res.full) waShow([waB]); });
    }
  });

  applyStatic();
  setUname();
  if(!GS && API.indexOf("https://") !== 0){
    $("#list").innerHTML = '<div class="empty"><strong>Anteprima</strong>Questa pagina funziona solo dentro Google Apps Script, dopo il deployment come App web.</div>';
    return;
  }
  var started_ = false;
  function start(){
    if(started_) return; started_ = true;
    call("getData", [token, true], apply);
    setInterval(refresh, 30000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh(); });
  }
  // Primo utilizzo (o telefono mancante): prima di tutto nome e telefono
  if(store("pt-ok") !== "1" || !myName() || !telOk(myTel())){
    $("#gName").value = myName(); $("#gKid").value = myKid(); $("#gTel").value = myTel();
    $("#gMore").hidden = !myName();
    $("#gate").hidden = false;
  } else start();
})();
</script>
</body>
</html>
